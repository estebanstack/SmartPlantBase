; Firmware del Matera-Gotchi (ESP32 + Arduino)
;   Compilar y subir el firmware principal:   pio run -e esp32dev -t upload
;   Compilar y subir la herramienta de pines: pio run -e diagnostico -t upload
;   Ver el puerto serie:                      pio device monitor
; (si "pio" no está en el PATH, usa el de tu venv: venv/bin/pio en Linux, venv\Scripts\pio.exe en Windows)

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    tzapu/WiFiManager@^2.0.17
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit SH110X@^2.1.10
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.0.4
    ricmoo/QRCode@^0.0.1

; Firmware principal: todo lo de src/ menos la carpeta del diagnóstico
[env:esp32dev]
build_src_filter = +<*> -<diagnostico/>

; Herramienta para descubrir pines y modelos de sensores: solo src/diagnostico/
[env:diagnostico]
build_src_filter = -<*> +<diagnostico/>
